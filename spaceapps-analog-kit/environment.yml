# Εναλλακτική με conda/mamba (αν το pip σκαλώσει σε GDAL/rasterio, κυρίως σε Windows)
#   mamba env create -f environment.yml
#   conda activate spaceapps
name: spaceapps
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - plotly
  - streamlit
  - jupyterlab
  - rasterio
  - pyproj
  - xarray
  - rioxarray
  - geopandas
  - shapely
  - earthaccess
